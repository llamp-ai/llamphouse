site_name: LLAMPHouse
site_description: Serving Your LLM Apps, Scalable and Reliable.
site_url: https://llamp-ai.github.io/llamphouse/docs/
repo_url: https://github.com/llamp-ai/llamphouse
repo_name: llamp-ai/llamphouse

site_dir: site/docs

hooks:
  - hooks/landing_page.py
  - hooks/sync_examples.py

docs_dir: docs

theme:
  name: shadcn
  custom_dir: docs/overrides
  show_title: true
  show_stargazers: true
  topbar_sections: true
  show_datetime: true
  icon: mdi:lamp-outline
  pygments_style:
    light: github-light
    dark: github-dark

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Adding an LLM: getting-started/adding-llm.md
  - Core Concepts:
    - Threads and Runs: concepts/threads-and-runs.md
    - Agents: concepts/agents.md
    - The Run Context: concepts/context.md
    - State: concepts/state.md
    - Sessions: concepts/sessions.md
    - Durable Runs: concepts/durable-runs.md
    - Working with Other Agents: concepts/multi-agent.md
  - Guides:
    - Streaming: guides/streaming.md
    - Tool Calls: guides/tool-calls.md
    - LangGraph: guides/langgraph.md
    - Config: guides/config.md
    - Files: guides/files.md
    - Triggers: guides/triggers.md
    - Subscriptions: guides/subscriptions.md
    - Adapters: guides/adapters.md
    - Auth: guides/auth.md
    - Tracing: guides/tracing.md
    - Compass: guides/compass.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - HTTP API: http-api.md
  - Examples: examples.md
  - Migrating from 1.x: migrating-from-1x.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - codehilite
  - fenced_code
  - footnotes
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.details
  - pymdownx.blocks.tab
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc
