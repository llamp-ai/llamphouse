# Postgres (the truth) and Redis (job queue, live events) for the 2.0 runtime: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llamphouse
      POSTGRES_PASSWORD: llamphouse
      POSTGRES_DB: llamphouse
    ports:
      - "5433:5432"
    volumes:
      - llamphouse-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llamphouse"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  llamphouse-v2:
