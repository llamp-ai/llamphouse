name: CI for PRs and Pushes (dev & main)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: llamphouse/llamphouse/core/adapters/compass/frontend/package-lock.json

      - name: Build Compass frontend
        working-directory: llamphouse/llamphouse/core/adapters/compass/frontend
        run: |
          npm ci
          npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deps: [latest, min]
        include:
          - deps: latest
            constraints: ""
          - deps: min
            constraints: ".github/workflows/constraints-min.in"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.constraints }}" ]; then
            pip install -e . -c ${{ matrix.constraints }}
            pip install -r tests/requirements.txt -c ${{ matrix.constraints }}
          else
            pip install -e .
            pip install -r tests/requirements.txt
          fi

      # - name: Lint
      #   run: |
      #     pip install flake8
      #     flake8 .

      # - name: Type checking with mypy
      #   run: |
      #     pip install mypy
      #     mypy .

      - name: Run Python code
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          python -m pytest tests/unit tests/contract tests/integration
