[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llamphouse"
description = "LLAMPHouse — Serving Your LLM Apps, Scalable and Reliable"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "stack-wise.co.uk", email = "pieter@stack-wise.co.uk" }]
dynamic = ["version"]
# the base install runs `llamphouse up --role all` in memory; extras add the other backends
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.100.0,<1.0",
    "uvicorn>=0.35.0,<1.0",
    "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["llamphouse"]
include = ["llamphouse", "llamphouse.core", "llamphouse.core.*", "llamphouse.cli", "llamphouse.cli.*",
           "llamphouse.sdk", "llamphouse.sdk.*", "llamphouse.runtime", "llamphouse.runtime.*"]
namespaces = true

[tool.setuptools.package-data]
"llamphouse.runtime.migrations" = ["*.mako", "versions/*.py"]
"llamphouse.core.adapters.dashboard" = ["static/**/*"]
"llamphouse.core.adapters.compass" = ["static/**/*"]

[project.scripts]
llamphouse = "llamphouse.runtime.cli:main"

[tool.setuptools.dynamic]
version = { attr = "llamphouse.__version__" }

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0,<1",
    "SQLAlchemy[asyncio]>=2.0.0,<2.1.0",
    "alembic>=1.17.2,<2",
    "psycopg2-binary>=2.9.9,<3",  # the Postgres tracing store
]
redis = ["redis[hiredis]>=5.0,<8"]
tracing = [
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp>=1.39,<2",
    "httpx>=0.27,<1",  # the ClickHouse tracing store
]
oidc = ["PyJWT[crypto]>=2.8,<3", "httpx>=0.27,<1"]
all = ["llamphouse[postgres,redis,tracing,oidc]"]
ag-ui = ["ag-ui-protocol>=1.0,<2"]
# llamphouse.core (1.x), while it is still in the package
v1 = [
    "SQLAlchemy>=2.0.0,<2.1.0",
    "psycopg2-binary>=2.9.9,<3",
    "asyncpg>=0.29.0,<1",
    "greenlet>=3.0.0,<4",
    "alembic>=1.17.2,<2",
    "python-dotenv>=1.2.1,<2",
    "janus>=2.0.0,<3",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp>=1.39,<2",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<1.0",
    "redis[hiredis]>=5.0,<8",
]

[dependency-groups]
dev = [
    "llamphouse[all,v1,ag-ui]",
    "httpx>=0.28.1",
    "openai>=2.21.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.19.0",
]
